# C6 – Kịch bản 4: Flash crowd – 8 leecher ập vào cùng lúc rồi rời đồng loạt
name: "flash_crowd"
description: "1 seed + 1 leecher tĩnh; 8 leecher ập vào trong 0.5s ở giây 2; rời đồng loạt ở giây 16 (50% crash)"

tracker:
  host: "127.0.0.1"
  port: 8000
  interval_sec: 2

torrent:
  file_name: "sample_data.bin"
  file_size_bytes: 2097152
  piece_length: 131072

swarm:
  num_seeds: 1
  num_leechers: 1
  base_port: 9001
  max_up_kbps: 256

churn:
  enabled: true
  mode: "flash_crowd"
  burst_time_sec: 2.0
  burst_size: 8
  burst_window_sec: 0.5
  mass_depart_time_sec: 16.0
  depart_fraction: 1.0
  crash_prob: 0.5
  port_offset: 100

netem:
  latency_ms: 20

simulation:
  duration_sec: 30
  random_seed: 42
  stop_when_complete: true
