# C6 – Kịch bản 1: Baseline (cơ sở). Định dạng: docs/log-and-scenario-spec.md
name: "baseline"
description: "1 seed, 3 leecher, mạng ổn định – mốc so sánh cho mọi kịch bản khác"

tracker:
  host: "127.0.0.1"
  port: 8000
  interval_sec: 2          # chu kỳ announce (StubTracker)

torrent:
  file_name: "sample_data.bin"
  file_size_bytes: 2097152 # 2 MiB
  piece_length: 131072     # 128 KiB -> 16 chunk

swarm:
  num_seeds: 1
  num_leechers: 3
  base_port: 9001
  max_up_kbps: 256         # KiB/s mỗi peer (Hợp đồng 4)

netem:
  latency_ms: 20

simulation:
  duration_sec: 45
  random_seed: 42
  stop_when_complete: true
